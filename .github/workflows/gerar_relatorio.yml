name: Gerar relatório AE2 (Open-Meteo + DuckDB)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'coleta.py'
      - 'banco.py'
      - 'relatorio.py'
      - 'consultas.sql'
      - 'config.json'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/gerar_relatorio.yml'

permissions:
  contents: write

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes de validação
        run: python -m unittest discover -s tests -v

      - name: Coletar JSON original da Open-Meteo
        run: python coleta.py

      - name: Tratar dados e carregar DuckDB
        run: python banco.py

      - name: Confirmar carga sem duplicidades
        run: python banco.py

      - name: Gerar consultas, indicadores, gráficos e relatório PDF
        run: python relatorio.py

      - name: Verificar artefatos e estrutura do relatório
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q = json.loads(Path('dados/qualidade.json').read_text(encoding='utf-8'))
          k = json.loads(Path('dados/indicadores.json').read_text(encoding='utf-8'))
          assert q['registros'] == 30 and q['datas_duplicadas'] == 0 and q['dias_faltantes'] == 0
          assert k['maior_temperatura_maxima_c'] is not None
          assert Path('dados/observatorio.duckdb').stat().st_size > 0
          assert Path('docs/escopo-1/AE2/Relatorio_AE2_Observatorio_Climatico.pdf').stat().st_size > 5000
          print('Validação final OK:', k)
          PY

      - name: Disponibilizar todos os resultados para consulta
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-climatico-AE2
          if-no-files-found: error
          path: |
            dados/originais/*.json
            dados/qualidade.json
            dados/indicadores.json
            dados/clima_diario_tratado.csv
            dados/observatorio.duckdb
            dados/evidencias/
            docs/escopo-1/AE2/Relatorio_AE2_Observatorio_Climatico.pdf

      - name: Publicar evidências e relatório no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/originais/*.json dados/qualidade.json dados/indicadores.json dados/clima_diario_tratado.csv dados/observatorio.duckdb dados/evidencias/ docs/escopo-1/AE2/Relatorio_AE2_Observatorio_Climatico.pdf
          if ! git diff --cached --quiet; then
            git commit -m "dados: registrar coleta real, SQL, gráficos e relatório AE2"
            git push
          else
            echo "Sem novos resultados para publicar."
          fi
