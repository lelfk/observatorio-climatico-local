name: Gerar relatório AE2 (Open-Meteo + DuckDB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'coleta.py'
      - 'banco.py'
      - 'relatorio.py'
      - 'consultas.sql'
      - 'config.json'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/gerar_relatorio.yml'

concurrency:
  group: observatorio-ae2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Coletar dados históricos
        run: python coleta.py

      - name: Tratar dados e carregar DuckDB
        run: python banco.py

      - name: Verificar carga repetida
        run: python banco.py

      - name: Gerar indicadores, gráficos e relatório
        run: python relatorio.py

      - name: Verificar resultados
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          qualidade = json.loads(
              Path("dados/qualidade.json").read_text(encoding="utf-8")
          )
          indicadores = json.loads(
              Path("dados/indicadores.json").read_text(encoding="utf-8")
          )

          assert qualidade["registros"] == 30
          assert qualidade["datas_duplicadas"] == 0
          assert qualidade["dias_faltantes"] == 0
          assert indicadores["maior_temperatura_maxima_c"] is not None
          assert Path("dados/observatorio.duckdb").stat().st_size > 0
          assert Path(
              "docs/escopo-1/AE2/Relatorio_AE2_Observatorio_Climatico.pdf"
          ).stat().st_size > 5000

          print("Validação final concluída.")
          print(json.dumps(indicadores, ensure_ascii=False, indent=2))
          PY

      - name: Publicar artefatos da execução
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-climatico-AE2
          if-no-files-found: error
          path: |
            dados/originais/*.json
            dados/qualidade.json
            dados/indicadores.json
            dados/clima_diario_tratado.csv
            dados/observatorio.duckdb
            dados/evidencias/
            docs/escopo-1/AE2/Relatorio_AE2_Observatorio_Climatico.pdf

      - name: Atualizar resultados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/originais/*.json \
            dados/qualidade.json \
            dados/indicadores.json \
            dados/clima_diario_tratado.csv \
            dados/observatorio.duckdb \
            dados/evidencias/ \
            docs/escopo-1/AE2/Relatorio_AE2_Observatorio_Climatico.pdf

          if ! git diff --cached --quiet; then
            git commit -m "dados: atualizar resultados da análise meteorológica"
            git push
          else
            echo "Os resultados já estão atualizados."
          fi
